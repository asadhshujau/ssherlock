# Runs what `just check` runs, on both platforms SSHerlock is developed on.
name: CI

# Changes that touch only these paths can't affect the build, so they don't start a run. A change
# that touches anything else as well still runs CI in full.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Nightly only for rustfmt: rustfmt.toml uses nightly-only import options.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  check:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Same packages as the README's Development setup.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libvulkan-dev mesa-vulkan-drivers libfontconfig-dev libfreetype-dev

      # gpui compiles Metal shaders at build time; Xcode 26+ ships the toolchain separately.
      - name: Ensure the Metal toolchain
        if: runner.os == 'macOS'
        run: xcrun -f metal || xcodebuild -downloadComponent MetalToolchain

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
