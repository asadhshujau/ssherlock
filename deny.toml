# cargo-deny configuration. Run with `just deny`.

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported only when we depend on them directly; transitive ones
# are outside our control and show up through the dependency that pulls them in.
unmaintained = "workspace"

[licenses]
# Permissive licences only. Add one here only after checking it is compatible with
# MIT OR Apache-2.0 distribution, with a comment saying which crate needs it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Public-domain dedication. Used by hexf-parse and tiny-keccak (via gpui).
    "CC0-1.0",
    # University of Illinois/NCSA, the BSD-style LLVM licence. Used by libfuzzer-sys (via gpui).
    "NCSA",
]
confidence-threshold = 0.9
# The list covers crates later phases add, so an allowance with no user yet is fine.
unused-allowed-license = "allow"

# Per-crate exceptions for licences we don't allow in general.
exceptions = [
    # MPL-2.0 is file-level copyleft: it covers only this crate's own (unmodified) files and
    # doesn't affect how SSHerlock is licensed. Pulled in by `directories` via `dirs-sys`.
    { crate = "option-ext", allow = ["MPL-2.0"] },
    # Same reasoning; both come in through gpui. cbindgen is a build-time tool, dwrote the
    # Windows DirectWrite bindings.
    { crate = "cbindgen", allow = ["MPL-2.0"] },
    { crate = "dwrote", allow = ["MPL-2.0"] },
]

[licenses.private]
ignore = false

[bans]
# Duplicate versions are worth knowing about but not worth failing the build for.
multiple-versions = "warn"
# gpui's own tree carries dozens of duplicates we can't control; ignoring them keeps the
# warning useful for duplicates we introduce.
skip-tree = [{ crate = "gpui", reason = "duplicates inside gpui's dependency tree are upstream's" }]
wildcards = "deny"
# Internal path dependencies carry a version, so they aren't wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
